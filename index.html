<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐝 Petualangan Robot Lebah - Matematika Kelas 4 SD</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
    }

    body {
        background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 50%, #90EE90 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
        position: relative;
        padding: 10px;
    }

    .cloud {
        position: absolute;
        background: white;
        border-radius: 50%;
        opacity: 0.8;
        animation: floatCloud 20s linear infinite;
        pointer-events: none;
    }
    .cloud::before, .cloud::after {
        content: '';
        position: absolute;
        background: white;
        border-radius: 50%;
    }
    .cloud1 { width: 80px; height: 40px; top: 10%; left: -100px; animation-duration: 25s; }
    .cloud1::before { width: 50px; height: 50px; top: -20px; left: 10px; }
    .cloud1::after { width: 40px; height: 40px; top: -15px; right: 10px; }

    .cloud2 { width: 100px; height: 50px; top: 25%; left: -150px; animation-duration: 35s; animation-delay: 5s; }
    .cloud2::before { width: 60px; height: 60px; top: -25px; left: 15px; }
    .cloud2::after { width: 50px; height: 50px; top: -20px; right: 15px; }

    @keyframes floatCloud {
        from { transform: translateX(0); }
        to { transform: translateX(120vw); }
    }

    .game-container {
        background: linear-gradient(145deg, #fff8dc, #ffefd5);
        border-radius: 30px;
        padding: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3), inset 0 0 30px rgba(255,215,0,0.2);
        border: 6px solid #FFD700;
        max-width: 720px;
        width: 100%;
        position: relative;
        z-index: 10;
        text-align: center;
    }

    h1 {
        color: #DAA520;
        font-size: 1.6em;
        margin-bottom: 3px;
        text-shadow: 2px 2px 0 #fff, 3px 3px 5px rgba(0,0,0,0.2);
    }

    .subtitle {
        color: #8B7355;
        font-size: 0.85em;
        margin-bottom: 12px;
        font-weight: bold;
    }

    .bee-area {
        height: 150px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        margin-bottom: 8px;
    }

    .bee {
        position: relative;
        transition: transform 0.3s;
        animation: beeHover 2s ease-in-out infinite;
    }

    @keyframes beeHover {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .bee.happy { animation: beeHappy 0.5s ease-in-out infinite; }
    @keyframes beeHappy {
        0%, 100% { transform: translateY(0) rotate(-5deg) scale(1); }
        50% { transform: translateY(-20px) rotate(5deg) scale(1.1); }
    }

    .bee.sad { animation: beeSad 0.6s ease-in-out infinite; }
    @keyframes beeSad {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(5px) rotate(3deg); }
    }

    .bee.talking { animation: beeTalk 0.3s ease-in-out infinite; }
    @keyframes beeTalk {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-5px) scale(1.03); }
    }

    .bee-svg {
        width: 120px;
        height: 120px;
        filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
    }

    /* Gelembung ucapan besar untuk penjelasan */
    .speech-bubble {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        border: 3px solid #FFD700;
        border-radius: 18px;
        padding: 8px 16px;
        font-size: 0.85em;
        color: #8B4513;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 5;
        max-width: 90%;
        line-height: 1.3;
    }
    .speech-bubble.show { opacity: 1; }
    .speech-bubble::after {
        content: '';
        position: absolute;
        bottom: -12px;
        left: 50%;
        transform: translateX(-50%);
        border: 8px solid transparent;
        border-top-color: #FFD700;
    }
    .speech-bubble::before {
        content: '';
        position: absolute;
        bottom: -7px;
        left: 50%;
        transform: translateX(-50%);
        border: 7px solid transparent;
        border-top-color: white;
        z-index: 1;
    }

    /* Panel penjelasan */
    .explain-panel {
        background: linear-gradient(145deg, #E8F5E9, #C8E6C9);
        border: 3px solid #4CAF50;
        border-radius: 15px;
        padding: 10px 15px;
        margin: 8px 0;
        font-size: 0.9em;
        color: #2E7D32;
        font-weight: bold;
        text-align: left;
        display: none;
        line-height: 1.5;
        box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
    }
    .explain-panel.show { display: block; animation: fadeIn 0.4s; }
    .explain-panel .step { display: block; margin: 3px 0; }
    .explain-panel .title { color: #1B5E20; font-size: 1.05em; }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .info-panel {
        display: flex;
        justify-content: space-around;
        margin-bottom: 12px;
        flex-wrap: wrap;
        gap: 8px;
    }

    .info-item {
        background: linear-gradient(145deg, #FFD700, #FFA500);
        color: white;
        padding: 7px 14px;
        border-radius: 15px;
        font-weight: bold;
        box-shadow: 0 4px 0 #B8860B;
        font-size: 0.85em;
    }

    .material-badge {
        background: linear-gradient(145deg, #9370DB, #6A5ACD);
        color: white;
        padding: 5px 14px;
        border-radius: 15px;
        font-weight: bold;
        font-size: 0.8em;
        margin-bottom: 8px;
        display: inline-block;
        box-shadow: 0 3px 0 #483D8B;
    }

    .question-box {
        background: white;
        border: 4px dashed #FFD700;
        border-radius: 20px;
        padding: 18px;
        margin: 10px 0;
        font-size: 2em;
        font-weight: bold;
        color: #8B4513;
        box-shadow: inset 0 0 20px rgba(255,215,0,0.2);
        letter-spacing: 2px;
        min-height: 80px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
    }

    .question-box .op { color: #FF6347; margin: 0 8px; }
    .question-box .eq { color: #DAA520; margin: 0 8px; }
    .question-box .blank { color: #4169E1; }

    .answers {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 12px;
    }

    .answer-btn {
        background: linear-gradient(145deg, #FFD700, #FFA500);
        border: none;
        border-radius: 18px;
        padding: 16px;
        font-size: 1.4em;
        font-weight: bold;
        color: white;
        cursor: pointer;
        box-shadow: 0 6px 0 #B8860B, 0 8px 15px rgba(0,0,0,0.2);
        transition: all 0.1s;
        text-shadow: 2px 2px 2px rgba(0,0,0,0.3);
    }

    .answer-btn:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 9px 0 #B8860B, 0 12px 20px rgba(0,0,0,0.25);
        filter: brightness(1.1);
    }

    .answer-btn:active:not(:disabled) {
        transform: translateY(3px);
        box-shadow: 0 3px 0 #B8860B;
    }

    .answer-btn:disabled { cursor: not-allowed; opacity: 0.7; }

    .answer-btn.correct {
        background: linear-gradient(145deg, #32CD32, #228B22);
        box-shadow: 0 6px 0 #006400;
        animation: pulseCorrect 0.5s;
    }
    @keyframes pulseCorrect {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }

    .answer-btn.wrong {
        background: linear-gradient(145deg, #FF6B6B, #DC143C);
        box-shadow: 0 6px 0 #8B0000;
        animation: shake 0.5s;
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
    }

    .controls {
        margin-top: 12px;
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .ctrl-btn {
        background: linear-gradient(145deg, #4A90E2, #2E5C8A);
        color: white;
        border: none;
        padding: 9px 16px;
        border-radius: 15px;
        font-size: 0.85em;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 0 #1a3a5c;
        transition: all 0.1s;
    }
    .ctrl-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #1a3a5c; }
    .ctrl-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #1a3a5c; }
    .ctrl-btn.voice-off {
        background: linear-gradient(145deg, #999, #666);
        box-shadow: 0 4px 0 #444;
    }

    .score-popup {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 4em;
        font-weight: bold;
        pointer-events: none;
        z-index: 100;
        opacity: 0;
    }

    .score-popup.show {
        animation: scorePop 1s ease-out forwards;
    }
    @keyframes scorePop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        30% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
        100% { opacity: 0; transform: translate(-50%, -100%) scale(1); }
    }

    .level-up {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: linear-gradient(145deg, #FFD700, #FFA500);
        color: white;
        padding: 25px 50px;
        border-radius: 25px;
        font-size: 1.8em;
        font-weight: bold;
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        border: 5px solid white;
        z-index: 200;
        opacity: 0;
        pointer-events: none;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
        text-align: center;
    }
    .level-up.show {
        animation: levelUpAnim 2s ease-out forwards;
    }
    @keyframes levelUpAnim {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-15deg); }
        20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(5deg); }
        80% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
    }

    .particle {
        position: fixed;
        pointer-events: none;
        font-size: 2em;
        z-index: 150;
        animation: particleFall 1.5s ease-out forwards;
    }
    @keyframes particleFall {
        0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
        100% { opacity: 0; transform: translateY(200px) rotate(360deg) scale(0.3); }
    }

    .menu-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 300;
        padding: 15px;
    }
    .menu-box {
        background: linear-gradient(145deg, #fff8dc, #ffefd5);
        border-radius: 25px;
        padding: 25px;
        border: 5px solid #FFD700;
        max-width: 500px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        max-height: 90vh;
        overflow-y: auto;
    }
    .menu-box h2 {
        color: #DAA520;
        margin-bottom: 10px;
        font-size: 1.3em;
    }
    .menu-box p {
        color: #8B7355;
        margin-bottom: 15px;
        font-size: 0.9em;
    }
    .menu-btn {
        display: block;
        width: 100%;
        margin-bottom: 10px;
        padding: 14px;
        border: none;
        border-radius: 15px;
        font-size: 1em;
        font-weight: bold;
        color: white;
        cursor: pointer;
        box-shadow: 0 5px 0 rgba(0,0,0,0.3);
        transition: all 0.15s;
        text-align: left;
    }
    .menu-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 rgba(0,0,0,0.3); }
    .menu-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(0,0,0,0.3); }
    .menu-btn .desc {
        display: block;
        font-size: 0.75em;
        font-weight: normal;
        opacity: 0.9;
        margin-top: 3px;
    }

    .mb1 { background: linear-gradient(145deg, #32CD32, #228B22); }
    .mb2 { background: linear-gradient(145deg, #4A90E2, #2E5C8A); }
    .mb3 { background: linear-gradient(145deg, #FF8C00, #FF6347); }
    .mb4 { background: linear-gradient(145deg, #9370DB, #6A5ACD); }
    .mb5 { background: linear-gradient(145deg, #FF69B4, #C71585); }
    .mb6 { background: linear-gradient(145deg, #20B2AA, #008B8B); }

    @media (max-width: 500px) {
        h1 { font-size: 1.2em; }
        .question-box { font-size: 1.4em; padding: 14px; }
        .answer-btn { font-size: 1.1em; padding: 12px; }
        .bee-svg { width: 95px; height: 95px; }
        .bee-area { height: 130px; }
        .info-item { font-size: 0.72em; padding: 5px 10px; }
        .speech-bubble { font-size: 0.72em; padding: 5px 10px; }
        .explain-panel { font-size: 0.8em; padding: 8px 10px; }
    }
</style>
</head>
<body>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<div class="score-popup" id="scorePopup"></div>
<div class="level-up" id="levelUp"></div>

<!-- Menu Pilih Materi -->
<div class="menu-overlay" id="menuOverlay">
    <div class="menu-box">
        <h2>🐝 Petualangan Robot Lebah 🐝</h2>
        <p><strong>Matematika Kelas 4 SD</strong><br>Pilih materi yang ingin dipelajari:</p>
        <button class="menu-btn mb1" onclick="startGame('penjumlahan')">
            ➕ Penjumlahan Bilangan Cacah
            <span class="desc">Bilangan sampai 10.000</span>
        </button>
        <button class="menu-btn mb2" onclick="startGame('pengurangan')">
            ➖ Pengurangan Bilangan Cacah
            <span class="desc">Bilangan sampai 10.000</span>
        </button>
        <button class="menu-btn mb3" onclick="startGame('perkalian')">
            ✖️ Perkalian Bilangan Cacah
            <span class="desc">2 digit × 1-2 digit</span>
        </button>
        <button class="menu-btn mb4" onclick="startGame('pembagian')">
            ➗ Pembagian Bilangan Cacah
            <span class="desc">Pembagian tanpa sisa</span>
        </button>
        <button class="menu-btn mb5" onclick="startGame('campuran')">
            🔀 Operasi Campuran
            <span class="desc">+ − × ÷ dalam satu soal</span>
        </button>
        <button class="menu-btn mb6" onclick="startGame('semua')">
            🎲 Semua Materi (Acak)
            <span class="desc">Latihan lengkap semua operasi</span>
        </button>
    </div>
</div>

<div class="game-container">
    <h1>🐝 Petualangan Robot Lebah 🐝</h1>
    <p class="subtitle">Matematika Kelas 4 SD - Bilangan Cacah</p>

    <div class="material-badge" id="materialBadge">➕ Penjumlahan</div>

    <div class="info-panel">
        <div class="info-item">⭐ Skor: <span id="score">0</span></div>
        <div class="info-item">🏆 Level: <span id="level">1</span></div>
        <div class="info-item">🔥 Streak: <span id="streak">0</span></div>

    <div class="bee-area">
        <div class="speech-bubble" id="speechBubble">Halo!</div>
        <div class="bee" id="bee">
            <svg class="bee-svg" viewBox="0 0 200 200" id="beeSvg">
                <ellipse cx="70" cy="70" rx="35" ry="25" fill="#E0F7FF" stroke="#A0D8EF" stroke-width="3" opacity="0.85" transform="rotate(-25 70 70)"/>
                <ellipse cx="130" cy="70" rx="35" ry="25" fill="#E0F7FF" stroke="#A0D8EF" stroke-width="3" opacity="0.85" transform="rotate(25 130 70)"/>
                <ellipse cx="100" cy="115" rx="55" ry="60" fill="#FFD700" stroke="#DAA520" stroke-width="4"/>
                <path d="M 55 95 Q 100 105 145 95" stroke="#2C2C2C" stroke-width="12" fill="none" stroke-linecap="round"/>
                <path d="M 50 120 Q 100 130 150 120" stroke="#2C2C2C" stroke-width="12" fill="none" stroke-linecap="round"/>
                <path d="M 55 145 Q 100 155 145 145" stroke="#2C2C2C" stroke-width="12" fill="none" stroke-linecap="round"/>
                <circle cx="100" cy="55" r="42" fill="#FFD700" stroke="#DAA520" stroke-width="4"/>
                <line x1="85" y1="25" x2="75" y2="5" stroke="#2C2C2C" stroke-width="4" stroke-linecap="round"/>

                <circle cx="115" cy="50" r="11" fill="white" stroke="#2C2C2C" stroke-width="2" id="eyeRight"/>
                <circle cx="87" cy="52" r="6" fill="#2C2C2C" id="pupilLeft"/>
                <circle cx="117" cy="52" r="6" fill="#2C2C2C" id="pupilRight"/>

    <div class="question-box" id="questionBox">
        <span id="num1">5</span>
        <span class="op" id="op">+</span>
        <span id="num2">3</span>
        <span class="eq">=</span>
        <span class="blank">?</span>
    </div>

    <!-- Panel penjelasan dari robot lebah -->
    <div class="explain-panel" id="explainPanel"></div>

    <div class="answers" id="answers"></div>

    <div class="controls">
        <button class="ctrl-btn" id="musicBtn" onclick="toggleMusic()">🎵 Musik: ON</button>
        <button class="ctrl-btn" id="voiceBtn" onclick="toggleVoice()">🔊 Suara: ON</button>
        <button class="ctrl-btn" onclick="repeatQuestion()">🔁 Ulangi Soal</button>
        <button class="ctrl-btn" onclick="showMenu()">📚 Ganti Materi</button>
        <button class="ctrl-btn" onclick="restartGame()">🔄 Ulang</button>
    </div>
</div>

<script>
// ============================================================
//  AUDIO SYSTEM (Musik latar & efek suara)
// ============================================================
let audioCtx = null;
let musicPlaying = true;
let musicTimeout = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type = 'sine', volume = 0.15, delay = 0) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t = audioCtx.currentTime + delay;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(volume, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration);
}

const bgMelody = [
    { n: 523.25, d: 0.35 }, { n: 659.25, d: 0.35 }, { n: 783.99, d: 0.35 }, { n: 659.25, d: 0.35 },
    { n: 587.33, d: 0.35 }, { n: 698.46, d: 0.35 }, { n: 880.00, d: 0.35 }, { n: 698.46, d: 0.35 },
    { n: 523.25, d: 0.35 }, { n: 587.33, d: 0.35 }, { n: 659.25, d: 0.35 }, { n: 587.33, d: 0.35 },
    { n: 493.88, d: 0.45 }, { n: 523.25, d: 0.7 },
];
let melodyIndex = 0;

function playBackgroundMusic() {
    if (!musicPlaying || !audioCtx) return;
    const note = bgMelody[melodyIndex];
    playTone(note.n, note.d * 0.9, 'triangle', 0.045);
    if (melodyIndex % 4 === 0) playTone(note.n / 4, 0.5, 'sine', 0.06);
    melodyIndex = (melodyIndex + 1) % bgMelody.length;
    musicTimeout = setTimeout(playBackgroundMusic, note.d * 1000);
}
function startMusic() { if (musicPlaying && !musicTimeout) playBackgroundMusic(); }
function stopMusic()  { if (musicTimeout) { clearTimeout(musicTimeout); musicTimeout = null; } }

function toggleMusic() {
    initAudio();
    musicPlaying = !musicPlaying;
    const btn = document.getElementById('musicBtn');
    if (musicPlaying) { btn.textContent = '🎵 Musik: ON'; startMusic(); }
    else { btn.textContent = '🔇 Musik: OFF'; stopMusic(); }
}

function playCorrectSound() {
    initAudio();
    [523.25, 659.25, 783.99, 1046.50].forEach((n, i) => playTone(n, 0.2, 'sine', 0.18, i * 0.12));
}
function playWrongSound() {
    initAudio();
    playTone(392.00, 0.25, 'sawtooth', 0.12, 0);
    playTone(329.63, 0.25, 'sawtooth', 0.12, 0.22);
    playTone(261.63, 0.5, 'sawtooth', 0.12, 0.44);
}
function playLevelUpSound() {
    initAudio();
    [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((n, i) => playTone(n, 0.2, 'sine', 0.18, i * 0.12));
}

// ============================================================
//  VOICE / TEXT-TO-SPEECH (Robot Lebah Bicara Bahasa Indonesia)
// ============================================================
let voiceEnabled = true;
let currentUtterance = null;
let indoVoice = null;

// Cari suara Bahasa Indonesia
function findIndoVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = speechSynthesis.getVoices();
    // Prioritas: id-ID, lalu id, lalu ms (Melayu mirip), lalu default
    indoVoice =
        voices.find(v => v.lang === 'id-ID') ||
        voices.find(v => v.lang && v.lang.toLowerCase().startsWith('id')) ||
        voices.find(v => v.lang === 'ms-MY') ||
        null;
    return indoVoice;
}

// Muat daftar suara (async di beberapa browser)
if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = () => { findIndoVoice(); };
    findIndoVoice();
}

// Fungsi utama robot bicara
function speak(text, options = {}) {
    if (!voiceEnabled || !('speechSynthesis' in window)) return;
    try {
        speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = 'id-ID';
        utt.rate = options.rate || 0.95;
        utt.pitch = options.pitch || 1.15; // sedikit tinggi = suara robot lucu
        utt.volume = 1;
        if (indoVoice) utt.voice = indoVoice;
        
        // Animasi mulut bergerak saat bicara
        utt.onstart = () => {
            document.getElementById('bee').classList.add('talking');
        };
        utt.onend = () => {
            document.getElementById('bee').classList.remove('talking');
        };
        
        currentUtterance = utt;
        speechSynthesis.speak(utt);
    } catch (e) {
        console.warn('TTS error:', e);
    }
}

// Berhenti bicara
function stopSpeaking() {
    if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        document.getElementById('bee').classList.remove('talking');
    }
}

// Toggle suara
function toggleVoice() {
    voiceEnabled = !voiceEnabled;
    const btn = document.getElementById('voiceBtn');
    if (voiceEnabled) {
        btn.textContent = '🔊 Suara: ON';
        btn.classList.remove('voice-off');
    } else {
        btn.textContent = '🔇 Suara: OFF';
        btn.classList.add('voice-off');
        stopSpeaking();
    }
}

// ============================================================
//  GAME STATE
// ============================================================
let score = 0;
let level = 1;
let streak = 0;
let correctAnswer = 0;
let canAnswer = true;
let questionsAnswered = 0;
let currentMaterial = 'penjumlahan';
let gameActive = false;
let currentQuestionData = null;

const materialLabels = {
    penjumlahan: '➕ Penjumlahan',
    pengurangan: '➖ Pengurangan',
    perkalian: '✖️ Perkalian',
    pembagian: '➗ Pembagian',
    campuran: '🔀 Operasi Campuran',
    semua: '🎲 Semua Materi'
};

// ============================================================
//  SOAL MATEMATIKA KELAS 4 SD (semua jawaban dijamin benar)
// ============================================================
function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Format angka dengan titik ribuan
function fmt(n) { return n.toLocaleString('id-ID'); }

// --- PENJUMLAHAN ---
function soalPenjumlahan() {
    let a, b;
    if (level <= 2) { a = randInt(100, 999); b = randInt(100, 999); }
    else if (level <= 4) { a = randInt(1000, 5000); b = randInt(1000, 5000); }
    else { a = randInt(2000, 9000); b = randInt(1000, 9000); }
    const answer = a + b; // ✅ dijamin benar
    return { 
        display: 'standard',
        a, b, op: '+', answer,
        explain: [
            `Susun bilangan secara bersusun ke bawah.`,
            `${fmt(a)} + ${fmt(b)} = ${fmt(answer)}`
        ]
    };
}

// --- PENGURANGAN (hasil selalu >= 0) ---
function soalPengurangan() {
    let a, b;
    if (level <= 2) { a = randInt(500, 999); b = randInt(100, a); }
    else if (level <= 4) { a = randInt(2000, 8000); b = randInt(500, a); }
    else { a = randInt(5000, 9999); b = randInt(1000, a); }
    const answer = a - b; // ✅ dijamin benar & tidak negatif
    return { 
        display: 'standard',
        a, b, op: '−', answer,
        explain: [
            `Susun bilangan secara bersusun ke bawah.`,
            `${fmt(a)} − ${fmt(b)} = ${fmt(answer)}`
        ]
    };
}

// --- PERKALIAN (2 digit × 1-2 digit) ---
function soalPerkalian() {
    let a, b;
    if (level <= 2) { a = randInt(11, 99); b = randInt(2, 9); }
    else if (level <= 4) { a = randInt(11, 50); b = randInt(11, 30); }
    else { a = randInt(20, 99); b = randInt(11, 50); }
    const answer = a * b; // ✅ dijamin benar
    return { 
        display: 'standard',
        a, b, op: '×', answer,
        explain: [
            `Kalikan secara bersusun.`,
            `${fmt(a)} × ${fmt(b)} = ${fmt(answer)}`
        ]
    };
}

// --- PEMBAGIAN (tanpa sisa, hasil & pembagi bulat) ---
function soalPembagian() {
    let hasil, pembagi, a;
    if (level <= 2) { pembagi = randInt(2, 9); hasil = randInt(2, 20); }
    else if (level <= 4) { pembagi = randInt(2, 12); hasil = randInt(5, 30); }
    else { pembagi = randInt(3, 15); hasil = randInt(10, 50); }
    a = pembagi * hasil; // ✅ a selalu habis dibagi pembagi
    return { 
        display: 'standard',
        a, b: pembagi, op: '÷', answer: hasil,
        explain: [
            `Cari bilangan yang jika dikalikan ${pembagi} hasilnya ${fmt(a)}.`,
            `${fmt(a)} ÷ ${pembagi} = ${fmt(hasil)}`,
            `Cek: ${pembagi} × ${fmt(hasil)} = ${fmt(a)} ✓`
        ]
    };
}

// --- OPERASI CAMPURAN (kali/bagi didahulukan) ---
function soalCampuran() {
    const tipe = randInt(1, 4);
    let answer, display, a, b, c;
    
    if (tipe === 1) {
        // a + b × c
        a = randInt(10, 100);
        b = randInt(2, 9);
        c = randInt(2, 9);
        answer = a + (b * c); // ✅
        return {
            display: 'campuran',
            expr: `${a} + ${b} × ${c}`,
            answer,
            explain: [
                `Aturan: kerjakan PERKALIAN dulu, baru penjumlahan.`,
                `Langkah 1: ${b} × ${c} = ${b * c}`,
                `Langkah 2: ${a} + ${b * c} = ${answer}`
            ]
        };
    } else if (tipe === 2) {
        // a − b × c (hasil positif)
        b = randInt(2, 9);
        c = randInt(2, 9);
        const bc = b * c;
        a = randInt(bc + 5, bc + 100);
        answer = a - bc; // ✅ selalu positif
        return {
            display: 'campuran',
            expr: `${a} − ${b} × ${c}`,
            answer,
            explain: [
                `Aturan: kerjakan PERKALIAN dulu, baru pengurangan.`,
                `Langkah 1: ${b} × ${c} = ${bc}`,
                `Langkah 2: ${a} − ${bc} = ${answer}`
            ]
        };
    } else if (tipe === 3) {
        // a × b + c
        a = randInt(2, 9);
        b = randInt(2, 9);
        c = randInt(10, 100);
        answer = (a * b) + c; // ✅
        return {
            display: 'campuran',
            expr: `${a} × ${b} + ${c}`,
            answer,
            explain: [
                `Aturan: kerjakan PERKALIAN dulu, baru penjumlahan.`,
                `Langkah 1: ${a} × ${b} = ${a * b}`,
                `Langkah 2: ${a * b} + ${c} = ${answer}`
            ]
        };
    } else {
        // a ÷ b + c
        b = randInt(2, 9);
        const hasil = randInt(3, 15);
        a = b * hasil; // ✅ habis dibagi
        c = randInt(5, 50);
        answer = hasil + c; // ✅
        return {
            display: 'campuran',
            expr: `${a} ÷ ${b} + ${c}`,
            answer,
            explain: [
                `Aturan: kerjakan PEMBAGIAN dulu, baru penjumlahan.`,
                `Langkah 1: ${a} ÷ ${b} = ${hasil}`,
                `Langkah 2: ${hasil} + ${c} = ${answer}`
            ]
        };
    }
}

// Generate soal berdasarkan materi
function generateQuestion() {
    const mat = currentMaterial === 'semua'
        ? ['penjumlahan', 'pengurangan', 'perkalian', 'pembagian'][randInt(0, 3)]
        : currentMaterial;

    switch (mat) {
        case 'penjumlahan': return soalPenjumlahan();
        case 'pengurangan': return soalPengurangan();
        case 'perkalian':   return soalPerkalian();
        case 'pembagian':   return soalPembagian();
        case 'campuran':    return soalCampuran();
    }
}

// ============================================================
//  PILIHAN JAWABAN (1 benar + 3 salah yang masuk akal)
// ============================================================
function generateChoices(correct) {
    const choices = new Set([correct]);
    const candidates = [];
    const magnitudes = [1, 10, 100, 2, 5, 20, 50];
    
    // Buat kandidat salah yang realistis
    for (const m of magnitudes) {
        candidates.push(correct + m);
        candidates.push(correct - m);
        candidates.push(correct + m * 2);
        candidates.push(correct - m * 2);
    }
    // Acak kandidat
    candidates.sort(() => Math.random() - 0.5);
    
    for (const c of candidates) {
        if (choices.size >= 4) break;
        if (c >= 0 && c !== correct) choices.add(c);
    }
    // Fallback
    let fb = 1;
    while (choices.size < 4) {
        const c = correct + fb * 13;
        if (c >= 0 && c !== correct) choices.add(c);
        fb++;
    }
    return Array.from(choices).sort(() => Math.random() - 0.5);
}

// ============================================================
//  RENDER SOAL
// ============================================================
function renderQuestion() {
    const q = generateQuestion();
    currentQuestionData = q;
    correctAnswer = q.answer;

    const qBox = document.getElementById('questionBox');
    if (q.display === 'campuran') {
        qBox.innerHTML = `<span style="font-size:0.85em">${q.expr}</span> <span class="eq">=</span> <span class="blank">?</span>`;
    } else {
        qBox.innerHTML = `
            <span>${fmt(q.a)}</span>
            <span class="op">${q.op}</span>
            <span>${fmt(q.b)}</span>
            <span class="eq">=</span>
            <span class="blank">?</span>
        `;
    }

    // Sembunyikan panel penjelasan (muncul nanti)
    const panel = document.getElementById('explainPanel');
    panel.classList.remove('show');
    panel.innerHTML = '';

    const choices = generateChoices(correctAnswer);
    const answersDiv = document.getElementById('answers');
    answersDiv.innerHTML = '';

    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = fmt(choice);
        btn.onclick = () => checkAnswer(btn, choice);
        answersDiv.appendChild(btn);
    });

    canAnswer = true;

    // Robot bacakan soal setelah jeda singkat
    setTimeout(() => bacakanSoal(q), 500);
}

// ============================================================
//  ROBOT BACA SOAL & JELASKAN
// ============================================================
function bacakanSoal(q) {
    if (!voiceEnabled) return;
    let teks;
    if (q.display === 'campuran') {
        // Ganti simbol agar TTS enak didengar
        teks = q.expr
            .replace(/÷/g, ' dibagi ')
            .replace(/×/g, ' dikali ')
            .replace(/\+/g, ' ditambah ')
            .replace(/−/g, ' dikurangi ')
            .replace(/\s+/g, ' ');
        teks = `Berapa hasil dari ${teks}?`;
    } else {
        const opText = { '+': 'ditambah', '−': 'dikurangi', '×': 'dikali', '÷': 'dibagi' }[q.op];
        teks = `Berapa hasil dari ${fmt(q.a)} ${opText} ${fmt(q.b)}?`;
    }
    speak(teks);
}

// Ulangi soal & penjelasan
function repeatQuestion() {
    initAudio();
    if (!currentQuestionData) return;
    bacakanSoal(currentQuestionData);
    // Tampilkan gelembung
    const bubble = document.getElementById('speechBubble');
    bubble.textContent = 'Dengarkan soal ini ya! 🎧';
    bubble.classList.add('show');
    clearTimeout(speechTimeout);
    speechTimeout = setTimeout(() => bubble.classList.remove('show'), 2500);
}

// Robot jelaskan cara penyelesaian
function jelaskanJawaban(q) {
    const panel = document.getElementById('explainPanel');
    let html = `<span class="title">🐝 Bee-Bot menjelaskan:</span>`;
    q.explain.forEach(step => { html += `<span class="step">• ${step}</span>`; });
    panel.innerHTML = html;
    panel.classList.add('show');

    // Bacakan penjelasan
    if (voiceEnabled) {
        const teks = q.explain.join('. ');
        speak(teks);
    }

    // Gelembung ucapan
    const bubble = document.getElementById('speechBubble');
    bubble.textContent = 'Begini cara menghitungnya! 📝';
    bubble.classList.add('show');
    clearTimeout(speechTimeout);
    speechTimeout = setTimeout(() => bubble.classList.remove('show'), 2500);
}

// ============================================================
//  CEK JAWABAN
// ============================================================
function checkAnswer(btn, choice) {
    if (!canAnswer) return;
    canAnswer = false;

    const allBtns = document.querySelectorAll('.answer-btn');
    allBtns.forEach(b => b.disabled = true);

    const q = currentQuestionData;

    if (choice === correctAnswer) {
        // BENAR
        btn.classList.add('correct');
        playCorrectSound();
        streak++;
        questionsAnswered++;
        
        const points = 10 + streak * 2;
        score += points;
        
        updateHUD();
        showBeeHappy();
        showScorePopup('+' + points, '#32CD32');
        createParticles('⭐');

        // Gelembung + suara pujian
        const pujian = randomHappyMessage();
        showSpeech(pujian);
        speak(pujian, { rate: 1.0, pitch: 1.3 });

        // Tampilkan penjelasan setelah 1 detik
        setTimeout(() => { jelaskanJawaban(q); }, 900);

        // Level up setiap 5 soal
        if (questionsAnswered % 5 === 0) {
            setTimeout(() => {
                level++;
                updateHUD();
                showLevelUp();
                playLevelUpSound();
                if (voiceEnabled) {
                    setTimeout(() => speak(`Hebat! Kamu naik ke level ${level}!`), 300);
                }
            }, 2000);
        }

        // Soal berikutnya
        setTimeout(() => { renderQuestion(); }, 5000);
    } else {
        // SALAH
        btn.classList.add('wrong');
        playWrongSound();
        streak = 0;
        updateHUD();
        showBeeSad();
        
        const pesanSedih = randomSadMessage();
        showSpeech(pesanSedih);
        speak(pesanSedih, { rate: 0.95, pitch: 0.9 });
        
        showScorePopup('❌', '#DC143C');

        // Tunjukkan jawaban benar
        setTimeout(() => {
            allBtns.forEach(b => {
                const val = parseInt(b.textContent.replace(/\./g, ''));
                if (val === correctAnswer) b.classList.add('correct');
            });
        }, 600);

        // Tampilkan penjelasan setelah 1.5 detik
        setTimeout(() => { jelaskanJawaban(q); }, 1500);

        // Soal berikutnya (lebih lama karena ada penjelasan)
        setTimeout(() => { renderQuestion(); }, 7000);
    }
}

//  UI & EKSPRESI
// ============================================================
function updateHUD() {
    document.getElementById('score').textContent = fmt(score);
    document.getElementById('level').textContent = level;
    document.getElementById('streak').textContent = streak;
}

function showBeeHappy() {
    const bee = document.getElementById('bee');
    const mouth = document.getElementById('mouth');
    const pupilL = document.getElementById('pupilLeft');
    const pupilR = document.getElementById('pupilRight');
    const eyeL = document.getElementById('eyeLeft');
    const eyeR = document.getElementById('eyeRight');

    bee.classList.remove('sad');
    bee.classList.add('happy');
    mouth.setAttribute('d', 'M 82 70 Q 100 90 118 70');
    eyeL.setAttribute('r', '13');
    eyeR.setAttribute('r', '13');
    pupilL.setAttribute('r', '7');
    pupilR.setAttribute('r', '7');

    setTimeout(() => bee.classList.remove('happy'), 1500);
}

function showBeeSad() {
    const bee = document.getElementById('bee');
    const mouth = document.getElementById('mouth');
    const pupilL = document.getElementById('pupilLeft');
    const pupilR = document.getElementById('pupilRight');

    bee.classList.remove('happy');
    bee.classList.add('sad');
    mouth.setAttribute('d', 'M 85 80 Q 100 68 115 80');
    pupilL.setAttribute('cy', '56');
    pupilR.setAttribute('cy', '56');

    setTimeout(() => {
        bee.classList.remove('sad');
        mouth.setAttribute('d', 'M 88 72 Q 100 82 112 72');
        pupilL.setAttribute('cy', '52');
        pupilR.setAttribute('cy', '52');

}

let speechTimeout = null;
function showSpeech(text) {
    const bubble = document.getElementById('speechBubble');
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(speechTimeout);
    speechTimeout = setTimeout(() => bubble.classList.remove('show'), 2500);
}

    'Wah, pintar sekali! 🌟',
    'Bee-Bot senang! 🐝💛',
    'Luar biasa! ✨',
    'Kamu jenius! 🧠',
    'Tepat sekali! 👏',
    'Mantap! 🚀',
    'Bee-Bot bangga! 💖'
];

const sadMessages = [
    'Yah, salah... coba lagi ya 😢',
    'Hmm, belum tepat... 🐝💧',
    'Jangan menyerah ya! 💪',
    'Sedikit lagi! Coba lagi 🌧️',
    'Bee-Bot sedih... 😔',
    'Tidak apa-apa, belajar terus! 📚'
];

function randomHappyMessage() { return happyMessages[Math.floor(Math.random() * happyMessages.length)]; }
function randomSadMessage() { return sadMessages[Math.floor(Math.random() * sadMessages.length)]; }

function showScorePopup(text, color) {
    const popup = document.getElementById('scorePopup');
    popup.textContent = text;
    popup.style.color = color;
    popup.classList.remove('show');
    void popup.offsetWidth;
    popup.classList.add('show');
}

function showLevelUp() {
    const el = document.getElementById('levelUp');
    el.innerHTML = `🎉 LEVEL ${level}! 🎉<br><span style="font-size:0.6em">Terus semangat belajar!</span>`;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
}

function createParticles(emoji) {
    for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = emoji;
        p.style.left = (50 + (Math.random() - 0.5) * 60) + '%';
        p.style.top = '40%';
        p.style.animationDelay = (Math.random() * 0.3) + 's';
        p.style.fontSize = (1.5 + Math.random() * 1.5) + 'em';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1800);
    }
}

// ============================================================
//  MENU & START
// ============================================================
function showMenu() {
    gameActive = false;
    stopSpeaking();
    document.getElementById('menuOverlay').style.display = 'flex';
    if (musicPlaying) stopMusic();
}

function startGame(material) {
    initAudio();
    // Pancing izin TTS dengan ucapan singkat
    if (voiceEnabled && 'speechSynthesis' in window) {
        findIndoVoice();
    }
    
    currentMaterial = material;
    document.getElementById('menuOverlay').style.display = 'none';
    document.getElementById('materialBadge').textContent = materialLabels[material];
    
    score = 0;
    level = 1;
    streak = 0;
    questionsAnswered = 0;
    gameActive = true;
    updateHUD();
    renderQuestion();
    
    const sapaan = `Halo teman! Ayo belajar ${materialLabels[material].replace(/[➕➖✖️➗🔀🎲]\s*/g, '')} bersama Bee-Bot!`;
    showSpeech('Ayo mulai! 🐝');
    speak(sapaan);
    
    if (musicPlaying) startMusic();
}

function restartGame() {
    if (!gameActive) return;
    stopSpeaking();
    score = 0;
    level = 1;
    streak = 0;
    questionsAnswered = 0;
    updateHUD();
    renderQuestion();
    showSpeech('Mulai dari awal! 🔄');
    speak('Baik, kita mulai dari awal!');
}

// ============================================================
//  INIT
// ============================================================
document.body.addEventListener('click', function initOnce() {
    initAudio();
    document.body.removeEventListener('click', initOnce);
}, { once: true });

window.addEventListener('load', () => {
    // Muat suara TTS
    if ('speechSynthesis' in window) {
        findIndoVoice();
        setTimeout(findIndoVoice, 500);
    }
    showSpeech('Pilih materi dulu ya! 📚');
});
